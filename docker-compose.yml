services:
  redis:
    image: redis:latest
    container_name: redis-container
    ports:
      - "6379:6379"
    networks:
      - app_network
    volumes:
      - redis-data:/data
  servicio-datos:
    build:
      context: ./servicio-datos
      dockerfile: Dockerfile
    depends_on:
      - redis
    networks:
      - app_network
    ports:
      - "6000:6000"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      MONGO_URI: "mongodb+srv://iprieto:j67Cmfi6ohUnbjv4@mlbstats.cmb2g.mongodb.net/MLBDB?retryWrites=true&w=majority&appName=MLBStats"
      PORT: 6000
    command: ["node", "servicio-datos/servicio-datos.js"]
  flask:
    build:
      context: ./servicio-usuarios
      dockerfile: Dockerfile
    networks:
      - app_network 
    ports:
      - "5000:5000" 
    volumes:
      - .:/app
      - .:/app/database
    command: ["python", "servicio-usuarios/app.py"]
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      - redis
      - servicio-datos
    networks:
      - app_network
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
    command: ["node", "server/server.js"]
networks:
  app_network:
    driver: bridge

volumes:
  redis-data: